backend:
  name: github
  repo: Rofimain/sumurbor
  branch: main
  base_url: https://oauth-sumurbor.rofimain.com
  auth_endpoint: auth

publish_mode: simple

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: https://sumurbor.rofimain.com
display_url: https://sumurbor.rofimain.com
logo_url: /images/branding/logo.svg

locale: "id"

collections:
  # ──────────────────────── PENGATURAN WEBSITE ─────────────
  - name: settings
    label: "Pengaturan Website"
    description: "Brand, kontak, sosial media, dan info global website."
    delete: false
    editor: { preview: false }
    files:
      - name: general
        label: "Umum"
        file: "content/settings/general.json"
        fields:
          - { name: brandName,     label: "Nama Brand",                       widget: string }
          - { name: brandTagline,  label: "Tagline",                          widget: string }
          - { name: logo,          label: "Logo (utama)",                     widget: image, required: false }
          - { name: logoLight,     label: "Logo (terang/footer)",             widget: image, required: false }
          - { name: favicon,       label: "Favicon",                          widget: image, required: false }
          - { name: ogImage,       label: "Gambar OG default (sosmed share)", widget: image, required: false }
          - { name: primaryColor,  label: "Warna Brand (HEX)",                widget: color, default: "#0ea5e9", allowInput: true }
          - { name: siteUrl,       label: "URL Website",                      widget: string }
          - { name: phone,         label: "Telepon (E.164, +62812…)",         widget: string }
          - { name: phoneDisplay,  label: "Telepon (tampilan)",               widget: string }
          - { name: whatsapp,      label: "WhatsApp (angka saja, 6281234…)",  widget: string }
          - { name: email,         label: "Email",                            widget: string }
          - name: address
            label: "Alamat"
            widget: object
            fields:
              - { name: street,      label: "Jalan",               widget: string }
              - { name: district,    label: "Kelurahan/Kecamatan", widget: string }
              - { name: city,        label: "Kota",                widget: string }
              - { name: region,      label: "Provinsi",            widget: string }
              - { name: postalCode,  label: "Kode Pos",            widget: string }
              - { name: country,     label: "Negara (kode)",       widget: string, default: "ID" }
          - { name: googleMapsUrl, label: "Google Maps URL",                  widget: string, required: false }
          - { name: businessHours, label: "Jam Operasional",                  widget: string }
          - name: social
            label: "Sosial Media"
            widget: object
            fields:
              - { name: instagram, label: "Instagram URL", widget: string, required: false }
              - { name: facebook,  label: "Facebook URL",  widget: string, required: false }
              - { name: linkedin,  label: "LinkedIn URL",  widget: string, required: false }
              - { name: youtube,   label: "YouTube URL",   widget: string, required: false }
              - { name: tiktok,    label: "TikTok URL",    widget: string, required: false }
          - name: areaServed
            label: "Area Layanan"
            widget: list
            field: { name: name, label: "Kota", widget: string }
          - { name: foundingYear, label: "Tahun Berdiri", widget: number, value_type: int }

      - name: about
        label: "Tentang Kami"
        file: "content/about/about.json"
        fields:
          - { name: title,    label: "Judul",     widget: string }
          - { name: subtitle, label: "Subjudul",  widget: string }
          - { name: intro,    label: "Intro",     widget: text }
          - { name: mission,  label: "Misi",      widget: text }
          - { name: vision,   label: "Visi",      widget: text }
          - name: values
            label: "Nilai"
            widget: list
            fields:
              - { name: title, label: "Judul",      widget: string }
              - { name: body,  label: "Deskripsi",  widget: text }
          - name: certifications
            label: "Sertifikasi"
            widget: list
            field: { name: cert, label: "Sertifikasi", widget: string }

  # ──────────────────────── LAYANAN ───────────────────────
  - name: services
    label: "Layanan"
    label_singular: "Layanan"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title,      label: "Judul",              widget: string }
      - { name: slug,       label: "Slug",               widget: string, hint: "URL: /layanan/[slug]" }
      - { name: order,      label: "Urutan",             widget: number, value_type: int, default: 1 }
      - { name: excerpt,    label: "Ringkasan",          widget: text }
      - name: icon
        label: "Icon"
        widget: select
        options: [droplets, construction, drill]
        default: droplets
      - { name: coverImage, label: "Gambar Cover",       widget: image, required: false }
      - name: features
        label: "Fitur"
        widget: list
        field: { name: item, label: "Fitur", widget: string }
      - name: faq
        label: "FAQ"
        widget: list
        fields:
          - { name: q, label: "Pertanyaan", widget: string }
          - { name: a, label: "Jawaban",    widget: text }
      - { name: body, label: "Konten", widget: markdown }

  # ──────────────────────── ARTIKEL ───────────────────────
  - name: articles
    label: "Artikel"
    label_singular: "Artikel"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title]
    fields:
      - { name: title,      label: "Judul",                          widget: string }
      - { name: slug,       label: "Slug",                           widget: string, hint: "URL: /artikel/[slug]" }
      - { name: date,       label: "Tanggal",                        widget: datetime }
      - { name: author,     label: "Penulis",                        widget: string, required: false, default: "Tim Engineering" }
      - { name: excerpt,    label: "Ringkasan",                      widget: text }
      - { name: coverImage, label: "Gambar Cover",                   widget: image, required: false }
      - name: tags
        label: "Tags"
        widget: list
        required: false
        field: { name: tag, label: "Tag", widget: string }
      - { name: readTime,   label: "Estimasi waktu baca (menit)",    widget: number, required: false, value_type: int }
      - { name: body,       label: "Konten",                         widget: markdown }

  # ──────────────────────── PROYEK ────────────────────────
  - name: projects
    label: "Proyek"
    label_singular: "Proyek"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} ({{year}})"
    sortable_fields: [year, title]
    fields:
      - { name: title,       label: "Judul Proyek",         widget: string }
      - { name: slug,        label: "Slug",                 widget: string, hint: "URL: /proyek/[slug]" }
      - { name: location,    label: "Lokasi",               widget: string }
      - { name: year,        label: "Tahun",                widget: number, value_type: int }
      - { name: serviceType, label: "Jenis Pekerjaan",      widget: string }
      - { name: depth,       label: "Kedalaman",            widget: string, required: false }
      - { name: diameter,    label: "Diameter",             widget: string, required: false }
      - { name: piles,       label: "Jumlah Titik",         widget: number, required: false, value_type: int }
      - { name: duration,    label: "Durasi Pengerjaan",    widget: string, required: false }
      - { name: client,      label: "Klien",                widget: string, required: false }
      - { name: coverImage,  label: "Gambar Cover",         widget: image, required: false }
      - name: gallery
        label: "Galeri"
        widget: list
        required: false
        field: { name: image, label: "Gambar", widget: image }
      - { name: summary, label: "Ringkasan",        widget: text }
      - { name: body,    label: "Detail Proyek",    widget: markdown }
